<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peach Blossom Stage — Phase 1 Visual Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:system-ui;}

/* Mood switcher */
#mood-bar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;gap:8px;padding:12px 16px;}
#mood-bar button{padding:6px 16px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;
  background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.7);cursor:pointer;font-size:13px;transition:all 0.2s;}
#mood-bar button:hover{background:rgba(255,255,255,0.1);color:#fff;}
#mood-bar button.active{background:rgba(255,255,255,0.15);border-color:rgba(255,240,200,0.5);color:#f0e8d8;}
/* Position bar */
#pos-bar{position:fixed;top:52px;left:0;right:0;z-index:100;display:flex;gap:6px;padding:4px 16px;}
#pos-bar button{padding:4px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:4px;
  background:rgba(0,0,0,0.5);color:rgba(255,255,255,0.5);cursor:pointer;font-size:12px;transition:all 0.2s;}
#pos-bar button:hover{background:rgba(255,255,255,0.08);color:#fff;}
#pos-bar button.active{background:rgba(255,200,140,0.15);border-color:rgba(255,200,140,0.4);color:#f0d8c0;}
#bg-bar{position:fixed;top:88px;left:0;right:0;z-index:100;display:flex;gap:6px;padding:4px 16px;}
#bg-bar button{padding:4px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:4px;
  background:rgba(0,0,0,0.5);color:rgba(255,255,255,0.5);cursor:pointer;font-size:12px;transition:all 0.2s;}
#bg-bar button:hover{background:rgba(255,255,255,0.08);color:#fff;}
#bg-bar button.active{background:rgba(120,200,160,0.15);border-color:rgba(120,200,160,0.4);color:#c0f0d0;}
#bg-bar button.danger{color:rgba(255,120,120,0.5);}
#bg-bar button.danger:hover{color:rgba(255,150,150,0.8);}
/* Background image crossfade — mirrors Reflex inline style approach */
#peach-bg-img{position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 0.8s ease;pointer-events:none;}
/* No .visible class — opacity controlled via element.style.opacity (same as Reflex rx.cond on style) */
#info{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;
  color:rgba(255,255,255,0.3);font-size:12px;pointer-events:none;}

/* ── Scene layers ── */
.peach-scene{position:fixed;inset:0;background:#020202;overflow:hidden;}
.peach-scene::before{content:'';position:fixed;inset:0;z-index:0;
  background-image:radial-gradient(circle,rgba(255,255,255,0.022)1px,transparent 1px);
  background-size:50px 50px;pointer-events:none;}

/* Radial Glow */
.peach-glow{position:fixed;top:50%;left:50%;z-index:1;width:0;height:0;pointer-events:none;}
.peach-glow::before{content:'';position:fixed;width:700px;height:700px;border-radius:50%;
  transform:translate(-50%,-50%);transition:background 0.6s ease;}
.peach-glow.serene::before{background:radial-gradient(circle,rgba(180,190,210,0.06)0%,rgba(156,163,175,0.03)35%,transparent 70%);}
.peach-glow.enchanted::before{background:radial-gradient(circle,rgba(220,180,190,0.08)0%,rgba(200,160,170,0.04)35%,transparent 70%);}
.peach-glow.tense::before{background:radial-gradient(circle,rgba(80,60,30,0.03)0%,rgba(60,40,20,0.02)35%,transparent 70%);}
.peach-glow.released::before{background:radial-gradient(circle,rgba(240,220,140,0.1)0%,rgba(220,200,120,0.05)35%,transparent 70%);}
.peach-glow.tranquil::before{background:radial-gradient(circle,rgba(220,200,150,0.06)0%,rgba(200,180,130,0.03)35%,transparent 70%);}
.peach-glow.wistful::before{background:radial-gradient(circle,rgba(120,115,110,0.04)0%,rgba(100,95,90,0.02)35%,transparent 70%);}

/* Grade overlay */
.peach-grade{position:fixed;inset:0;z-index:2;pointer-events:none;transition:background 0.6s ease;}
.peach-grade.serene{background:rgba(168,184,200,0.12);}
.peach-grade.enchanted{background:rgba(232,192,208,0.18);}
.peach-grade.tense{background:rgba(48,32,16,0.30);}
.peach-grade.released{background:rgba(240,232,192,0.12);}
.peach-grade.tranquil{background:rgba(232,216,176,0.10);}
.peach-grade.wistful{background:rgba(144,136,128,0.22);}

/* Vignette */
.peach-vignette{position:fixed;inset:0;z-index:3;pointer-events:none;transition:background 0.6s ease;}
.peach-vignette.serene{background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.15)70%,rgba(0,0,0,0.35)100%);}
.peach-vignette.enchanted{background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.12)70%,rgba(0,0,0,0.28)100%);}
.peach-vignette.tense{background:radial-gradient(ellipse at center,transparent 18%,rgba(0,0,0,0.5)52%,rgba(0,0,0,0.85)100%);}
.peach-vignette.released{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.08)75%,rgba(0,0,0,0.2)100%);}
.peach-vignette.tranquil{background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.1)72%,rgba(0,0,0,0.25)100%);}
.peach-vignette.wistful{background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.25)65%,rgba(0,0,0,0.55)100%);}

/* Light Slit (z-17) */
@keyframes slit-breathe{0%,100%{opacity:0.3;transform:translateX(-50%)scaleY(1);}50%{opacity:0.7;transform:translateX(-50%)scaleY(1.04);}}
#slit{position:fixed;top:15%;left:50%;z-index:6;width:120px;height:70%;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(220,190,120,0.25)0%,rgba(200,160,80,0.08)30%,transparent 70%);
  opacity:0;transition:opacity 0.8s ease;pointer-events:none;}
#slit::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:3px;height:100%;
  background:linear-gradient(to bottom,transparent 0%,rgba(240,210,140,0.5)15%,rgba(240,210,140,0.6)50%,rgba(240,210,140,0.5)85%,transparent 100%);
  box-shadow:0 0 20px rgba(240,210,140,0.15),0 0 60px rgba(220,180,100,0.06);}
#slit.tense{opacity:1;animation:slit-breathe 4s ease-in-out infinite;}
#slit.tense::after{animation:slit-breathe 4s ease-in-out infinite;}

/* Transition overlay (z-18) */
@keyframes transition-constrict{
  0%{background:transparent;}
  28%{background:radial-gradient(ellipse at center,transparent 15%,rgba(0,0,0,0.6)50%,rgba(0,0,0,0.92)100%);}
  48%{background:#000;}
  52%{background:#000;}
  80%{background:radial-gradient(ellipse at center,rgba(240,220,140,0.15)0%,rgba(200,160,60,0.06)40%,transparent 70%);}
  100%{background:transparent;}
}
#tr-overlay{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;}
.peach-transition-constrict #tr-overlay{animation:transition-constrict 2.5s ease-in-out forwards;}
/* Transition button */
#tr-btn{position:fixed;top:124px;left:16px;z-index:100;padding:6px 16px;
  border:1px solid rgba(255,200,120,0.4);border-radius:6px;
  background:rgba(255,160,40,0.12);color:rgba(255,200,120,0.8);
  cursor:pointer;font-size:13px;transition:all 0.2s;}
#tr-btn:hover{background:rgba(255,180,60,0.2);color:#ffd8a0;}

/* Canvas layers */
#peach-particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none;}
#peach-sigil{position:fixed;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none;}

/* HUD (test) */
#test-hud{position:fixed;top:20px;right:24px;z-index:50;pointer-events:none;
  color:rgba(240,232,200,0.5);font-size:14px;letter-spacing:0.1em;}
#fps{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:50;
  color:rgba(255,255,255,0.2);font-size:11px;pointer-events:none;}
</style>
</head>
<body>

<div id="mood-bar">
  <button onclick="setMood('serene')" class="active" id="btn-serene">🌊 缘溪行</button>
  <button onclick="setMood('enchanted')" id="btn-enchanted">🌸 桃花林</button>
  <button onclick="setMood('tense')" id="btn-tense">🕳 山洞</button>
  <button onclick="setMood('released')" id="btn-released">✨ 豁然</button>
  <button onclick="setMood('tranquil')" id="btn-tranquil">🏘 桃花源</button>
  <button onclick="setMood('wistful')" id="btn-wistful">🛤 归来</button>
</div>
<div id="pos-bar">
  <button onclick="setPos('center')" class="active" id="pos-center">⊙ 中央</button>
  <button onclick="setPos('stream_left')" id="pos-stream_left">← 溪左</button>
  <button onclick="setPos('forest_edge')" id="pos-forest_edge">↗ 林边</button>
  <button onclick="setPos('cave_entrance')" id="pos-cave_entrance">↑ 洞口</button>
  <button onclick="setPos('village_center')" id="pos-village_center">⊙ 村心</button>
</div>
<div id="bg-bar">
  <button onclick="setBg('peach-forest')" id="bg-peach-forest">🌸 桃林背景</button>
  <button onclick="setBg('cave')" id="bg-cave">🕳 山洞背景</button>
  <button onclick="setBg('village')" id="bg-village">🏘 村落背景</button>
  <button onclick="clearBg()" class="danger">✕ 清除</button>
</div>
<button id="tr-btn" onclick="triggerTransition()">✨ 豁然开朗</button>
<div id="test-hud">桃花源记 · Phase 1+2 Test</div>
<div id="info">1-6=mood  ·  g=gesture  ·  BG crossfade  ·  ✨=3-stage transition</div>
<div id="fps">FPS: --</div>

<div class="peach-scene"></div>
<img id="peach-bg-img" src="" alt="">
<div class="peach-glow serene" id="glow"></div>
<div class="peach-grade serene" id="grade"></div>
<div class="peach-vignette serene" id="vignette"></div>
<div class="peach-slit serene" id="slit"></div>
<div id="tr-overlay"></div>
<canvas id="peach-particles"></canvas>
<canvas id="peach-sigil"></canvas>

<!-- Hidden store (simulates Reflex data binding) -->
<div id="peach-store" data-atmosphere="serene" data-sigil-position="center" data-transition="" hidden></div>

<script>
// ══════════════════════════════════════════════════════════════
// Mood config (mirrors Python MOOD dict)
// ══════════════════════════════════════════════════════════════
var MOODS = {
  serene:{type:'water',count:60,colors:['rgba(200,220,248,0.5)','rgba(138,180,224,0.3)','rgba(180,200,230,0.25)'],speed:0.3,sigilInner:'rgba(248,240,200,0.9)',sigilOuter:'rgba(230,210,160,0.3)',sigilSize:1.0,sigilBreathS:4.0,sigilTrail:15},
  enchanted:{type:'petal',count:120,colors:['rgba(248,208,220,0.55)','rgba(232,168,192,0.35)','rgba(255,220,235,0.4)'],speed:0.6,sigilInner:'rgba(248,220,210,0.9)',sigilOuter:'rgba(240,200,180,0.3)',sigilSize:1.05,sigilBreathS:2.0,sigilTrail:12},
  tense:{type:'water',count:40,colors:['rgba(140,150,170,0.4)','rgba(100,110,130,0.25)','rgba(120,130,150,0.2)'],speed:0.15,sigilInner:'rgba(180,150,100,0.85)',sigilOuter:'rgba(120,80,40,0.2)',sigilSize:0.7,sigilBreathS:1.5,sigilTrail:5},
  released:{type:'gold_burst',count:180,colors:['rgba(248,224,128,0.7)','rgba(240,208,64,0.5)','rgba(255,240,180,0.6)'],speed:1.0,sigilInner:'rgba(250,235,170,0.95)',sigilOuter:'rgba(240,210,130,0.35)',sigilSize:1.3,sigilBreathS:3.0,sigilTrail:20},
  tranquil:{type:'petal',count:80,colors:['rgba(240,220,160,0.4)','rgba(220,200,140,0.25)','rgba(245,225,170,0.3)'],speed:0.35,sigilInner:'rgba(245,225,170,0.9)',sigilOuter:'rgba(230,200,140,0.3)',sigilSize:1.1,sigilBreathS:5.0,sigilTrail:18},
  wistful:{type:'water',count:50,colors:['rgba(160,155,150,0.35)','rgba(130,125,120,0.2)','rgba(150,145,140,0.18)'],speed:0.2,sigilInner:'rgba(180,170,160,0.8)',sigilOuter:'rgba(140,130,120,0.2)',sigilSize:0.8,sigilBreathS:6.0,sigilTrail:8}
};

// ══════════════════════════════════════════════════════════════
// Position map + switcher
// ══════════════════════════════════════════════════════════════
var POSITIONS={
  center:         {x:0.50, y:0.45},
  stream_left:    {x:0.28, y:0.55},
  forest_edge:    {x:0.35, y:0.48},
  cave_entrance:  {x:0.50, y:0.52},
  village_center: {x:0.50, y:0.40},
};
function setPos(pos){
  document.querySelectorAll('#pos-bar button').forEach(function(b){b.classList.remove('active');});
  document.getElementById('pos-'+pos).classList.add('active');
  document.getElementById('peach-store').setAttribute('data-sigil-position',pos);
}

// ══════════════════════════════════════════════════════════════
// Background image crossfade (simulates set_background_image / clear_background_image)
// ══════════════════════════════════════════════════════════════
// Simple SVG gradient images for three chapter scenes
var BG_IMAGES = {
  'peach-forest': 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a0a10"/><stop offset="40%" stop-color="#3d1828"/><stop offset="70%" stop-color="#5c2840"/><stop offset="100%" stop-color="#1a0a10"/></linearGradient></defs><rect width="800" height="600" fill="url(#g)"/><circle cx="600" cy="200" r="80" fill="rgba(255,200,180,0.08)"/><text x="400" y="300" text-anchor="middle" fill="rgba(248,208,220,0.3)" font-size="48" font-family="serif">🌸 桃花林</text></svg>'),
  'cave': 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><defs><radialGradient id="g" cx="50%" cy="45%"><stop offset="0%" stop-color="#1a1008"/><stop offset="30%" stop-color="#0a0604"/><stop offset="70%" stop-color="#000000"/><stop offset="100%" stop-color="#000000"/></radialGradient></defs><rect width="800" height="600" fill="url(#g)"/><circle cx="400" cy="270" r="30" fill="rgba(255,200,120,0.15)"/><text x="400" y="310" text-anchor="middle" fill="rgba(180,150,100,0.3)" font-size="48" font-family="serif">🕳 山洞</text></svg>'),
  'village': 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1808"/><stop offset="40%" stop-color="#3d3820"/><stop offset="100%" stop-color="#1a1808"/></linearGradient></defs><rect width="800" height="600" fill="url(#g)"/><circle cx="200" cy="280" r="60" fill="rgba(240,220,140,0.06)"/><text x="400" y="310" text-anchor="middle" fill="rgba(240,220,160,0.3)" font-size="48" font-family="serif">🏘 桃花源</text></svg>')
};
var currentBg = null;
var bgImg = null;
function getBgImg(){
  if(!bgImg)bgImg=document.getElementById('peach-bg-img');
  return bgImg;
}
function setBg(key){
  document.querySelectorAll('#bg-bar button:not(.danger)').forEach(function(b){b.classList.remove('active');});
  document.getElementById('bg-'+key).classList.add('active');
  var img=getBgImg();
  img.src=BG_IMAGES[key];
  // Mirrors Reflex: rx.cond(cls.background_image, {"opacity":"1",...}, {"opacity":"0",...})
  img.style.opacity='1';
  img.style.transition='opacity 0.8s ease';
  currentBg=key;
}
function clearBg(){
  document.querySelectorAll('#bg-bar button:not(.danger)').forEach(function(b){b.classList.remove('active');});
  var img=getBgImg();
  // Mirrors Reflex: state cleared → rx.cond returns opacity:0 dict
  img.style.opacity='0';
  currentBg=null;
}

// ══════════════════════════════════════════════════════════════
// Mood switcher
// ══════════════════════════════════════════════════════════════
function setMood(mood){
  document.querySelectorAll('#mood-bar button').forEach(function(b){b.classList.remove('active');});
  document.getElementById('btn-'+mood).classList.add('active');

  // Update CSS layers
  ['glow','grade','vignette','slit'].forEach(function(id){
    var el=document.getElementById(id);
    el.className=el.className.replace(/serene|enchanted|tense|released|tranquil|wistful/g,mood);
  });

  // Update store → triggers JS bridge
  document.getElementById('peach-store').setAttribute('data-atmosphere',mood);
}

// Transition trigger (simulates Ghost: set_transition constrict + set_atmosphere released)
function triggerTransition(){
  setMood('tense');
  setPos('cave_entrance');
  setTimeout(function(){
    document.getElementById('peach-store').setAttribute('data-transition','constrict');
    document.body.classList.add('peach-transition-constrict');
    setTimeout(function(){
      document.body.classList.remove('peach-transition-constrict');
      document.getElementById('peach-store').setAttribute('data-transition','');
      setMood('released');
    }, 2600);
  }, 400);
}

// ══════════════════════════════════════════════════════════════
// JS Bridge: store → window globals
// ══════════════════════════════════════════════════════════════
(function(){
  var store=document.getElementById('peach-store');
  var lastMood='',lastPos='center',lastTrans='';
  function sync(){
    var mood=store.getAttribute('data-atmosphere')||'';
    var pos=store.getAttribute('data-sigil-position')||'center';
    var trans=store.getAttribute('data-transition')||'';
    var dirty=false;

    if(mood&&mood!==lastMood){
      lastMood=mood;
      var cfg=MOODS[mood];if(!cfg)return;
      window.__PEACH_PARTICLE_CONFIG__={type:cfg.type,count:cfg.count,colors:cfg.colors,speed:cfg.speed};
      var sigil=window.__PEACH_SIGIL_CONFIG__||{};
      sigil.mood=mood;sigil.innerColor=cfg.sigilInner;sigil.outerColor=cfg.sigilOuter;
      sigil.size=cfg.sigilSize;sigil.breathS=cfg.sigilBreathS;sigil.trailLen=cfg.sigilTrail;
      window.__PEACH_SIGIL_CONFIG__=sigil;
      dirty=true;
    }

    if(pos&&pos!==lastPos){
      lastPos=pos;
      var pt=POSITIONS[pos];if(!pt)return;
      var sigil=window.__PEACH_SIGIL_CONFIG__||{};
      sigil.targetX=pt.x;sigil.targetY=pt.y;
      window.__PEACH_SIGIL_CONFIG__=sigil;
    }

    if(trans!==lastTrans){
      lastTrans=trans;
      if(trans==='constrict'){
        window.__PEACH_TRANSITION__={state:trans,startTime:performance.now()};
      }else{
        window.__PEACH_TRANSITION__=null;
      }
    }

    if(!dirty&&pos===lastPos&&trans===lastTrans)return;
  }
  sync();
  new MutationObserver(sync).observe(store,{attributes:true,attributeFilter:['data-atmosphere','data-sigil-position','data-transition']});
})();

// ══════════════════════════════════════════════════════════════
// Particle Canvas
// ══════════════════════════════════════════════════════════════
(function S(){
  var c=document.getElementById('peach-particles');
  if(!c){setTimeout(S,80);return;}
  var ctx=c.getContext('2d'),W,H;
  function R(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  window.addEventListener('resize',R);R();
  var CFG=window.__PEACH_PARTICLE_CONFIG__||{type:'water',count:60,colors:['rgba(200,220,248,0.5)','rgba(138,180,224,0.3)'],speed:0.3};
  var pool=[];

  function P(){
    this.reset=function(mode){
      if(mode==='petal'){
        this.x=Math.random()*W;this.y=-20-Math.random()*H*0.5;
        this.sway=Math.random()*6.28;this.swaySp=0.015+Math.random()*0.025;
        this.fallSp=0.5+Math.random()*0.6;this.size=1.5+Math.random()*2.5;
      }else if(mode==='gold_burst'){
        var a=Math.random()*6.28,sp=CFG.speed*(1.5+Math.random()*3.5);
        this.vx=Math.cos(a)*sp;this.vy=Math.sin(a)*sp;
        this.x=W*0.5;this.y=H*0.5;this.life=1.0;this.size=2+Math.random()*4;
      }else{
        this.x=Math.random()*W;this.y=Math.random()*H;
        this.wave=Math.random()*6.28;this.waveSp=0.01+Math.random()*0.02;
        this.driftSp=0.3+Math.random()*0.5;this.size=0.8+Math.random()*2.2;
      }
      this.phase=Math.random()*6.28;
    };
    this.update=function(){
      var trP=window.__PEACH_TR_PHASE__||0;
      var trPr=window.__PEACH_TR_PROGRESS__||0;
      // Phase 3: force-reset to gold_burst from center
      if(trP===3&&trPr>0.05&&Math.random()<0.12){
        var a=Math.random()*6.28,sp=CFG.speed*(2+Math.random()*4);
        this.vx=Math.cos(a)*sp;this.vy=Math.sin(a)*sp;
        this.x=W*0.5;this.y=H*0.45;this.life=1.0;this.size=2+Math.random()*5;
        return;
      }
      if(CFG.type==='petal'){
        this.y+=CFG.speed*this.fallSp;this.sway+=this.swaySp;
        this.x+=Math.sin(this.sway)*0.5;
        if(this.y>H+40){this.y=-20;this.x=Math.random()*W;this.sway=Math.random()*6.28;}
        if(this.x<-40)this.x=W+40;if(this.x>W+40)this.x=-40;
      }else if(CFG.type==='gold_burst'){
        this.vx*=0.97;this.vy*=0.97;this.x+=this.vx*CFG.speed;this.y+=this.vy*CFG.speed;
        this.life-=0.003;
        if(this.life<=0||this.x<-80||this.x>W+80||this.y<-80||this.y>H+80)this.reset('gold_burst');
      }else{
        this.x+=CFG.speed*this.driftSp;this.wave+=this.waveSp;
        this.y+=Math.sin(this.wave)*0.3;
        if(this.x>W+40){this.x=-20;this.y=Math.random()*H;}
        if(this.y<-40)this.y=H+40;if(this.y>H+40)this.y=-40;
      }
      // Phase 1: contract toward center
      if(trP===1){
        var cx=W*0.5,cy=H*0.45;
        var force=0.02*(1+trPr*2);
        this.x+=(cx-this.x)*force;this.y+=(cy-this.y)*force;
      }
    };
    this.draw=function(t){
      var trP=window.__PEACH_TR_PHASE__||0;
      var tw=0.6+0.4*Math.sin(t*0.0004+this.phase);
      var alpha=CFG.type==='gold_burst'?Math.max(0,this.life)*tw*1.5:tw;
      if(trP===2){alpha*=0.1;}
      else if(trP===1){alpha*=0.3+0.7*(1-(window.__PEACH_TR_PROGRESS__||0));}
      var sz=CFG.type==='gold_burst'?this.size*this.life:this.size;
      var col=CFG.colors[Math.floor(Math.abs(Math.sin(this.phase*3.7))*CFG.colors.length)%CFG.colors.length];
      var m=col.match(/[\d.]+/g);
      if(m&&m.length>=4){ctx.fillStyle='rgba('+m[0]+','+m[1]+','+m[2]+','+Math.min(1,parseFloat(m[3])*alpha*1.6).toFixed(3)+')';}
      else{ctx.fillStyle=col;}
      ctx.beginPath();ctx.arc(this.x,this.y,Math.max(0.3,sz),0,6.28);ctx.fill();
    };
    this.reset(CFG.type);
  }
  function ensurePool(n){while(pool.length<n)pool.push(new P());while(pool.length>n)pool.pop();}
  ensurePool(CFG.count);
  var lastType=CFG.type,lastCount=CFG.count;
  function sync(){
    var g=window.__PEACH_PARTICLE_CONFIG__;if(!g)return;
    if(g.type&&g.type!==lastType){lastType=g.type;CFG.type=g.type;for(var i=0;i<pool.length;i++)pool[i].reset(g.type);}
    if(g.count&&g.count!==lastCount){lastCount=g.count;CFG.count=g.count;ensurePool(g.count);}
    if(g.colors)CFG.colors=g.colors;
    if(g.speed!==undefined)CFG.speed=g.speed;
  }
  function A(t){
    sync();
    var tr=window.__PEACH_TRANSITION__;
    var trPhase=0,trProgress=0;
    if(tr&&tr.state==='constrict'){
      var el=(t-tr.startTime)/1000;
      if(el<0.8){trPhase=1;trProgress=el/0.8;}
      else if(el<1.2){trPhase=2;}
      else if(el<2.5){trPhase=3;trProgress=(el-1.2)/1.3;}
      else{window.__PEACH_TRANSITION__=null;}
    }
    window.__PEACH_TR_PHASE__=trPhase;
    window.__PEACH_TR_PROGRESS__=trProgress;
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<pool.length;i++){pool[i].update();pool[i].draw(t);}
    requestAnimationFrame(A);
  }
  requestAnimationFrame(A);
})();

// ══════════════════════════════════════════════════════════════
// Sigil Canvas
// ══════════════════════════════════════════════════════════════
(function S(){
  var c=document.getElementById('peach-sigil');
  if(!c){setTimeout(S,80);return;}
  var ctx=c.getContext('2d'),W,H;
  function R(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  window.addEventListener('resize',R);R();
  var DEF=window.__PEACH_SIGIL_CONFIG__||{mood:'serene',innerColor:'rgba(248,240,200,0.9)',outerColor:'rgba(230,210,160,0.3)',size:1.0,breathS:4.0,trailLen:15};
  var cx=W*0.5,cy=H*0.45,targetX=0.5,targetY=0.45,trail=[],gesture=0,targetGesture=0;
  function lerp(a,b,t){return a+(b-a)*t;}
  function sync(){
    var g=window.__PEACH_SIGIL_CONFIG__;if(!g)return;
    if(g.innerColor)DEF.innerColor=g.innerColor;if(g.outerColor)DEF.outerColor=g.outerColor;
    if(g.size)DEF.size=g.size;if(g.breathS)DEF.breathS=g.breathS;if(g.trailLen)DEF.trailLen=g.trailLen;
    if(g.targetX!==undefined)targetX=g.targetX;if(g.targetY!==undefined)targetY=g.targetY;
  }
  function A(t){
    sync();
    // ── 3-stage transition state machine ──
    var tr=window.__PEACH_TRANSITION__;
    var trPhase=0,trProgress=0;
    if(tr&&tr.state==='constrict'){
      var el=(t-tr.startTime)/1000;
      if(el<0.8){trPhase=1;trProgress=el/0.8;}
      else if(el<1.2){trPhase=2;}
      else if(el<2.5){trPhase=3;trProgress=(el-1.2)/1.3;}
    }
    var trSizeMul=1,trBreathMul=1,trAlphaMul=1;
    var trInner=DEF.innerColor,trOuter=DEF.outerColor;
    if(trPhase===1){
      trSizeMul=1-trProgress*0.6;trBreathMul=1+trProgress*2;trAlphaMul=1-trProgress*0.35;
      trInner='rgba(200,160,100,0.85)';trOuter='rgba(140,90,40,0.2)';
    }else if(trPhase===2){
      trSizeMul=0.18;trBreathMul=5;trAlphaMul=0.4;
      trInner='rgba(240,210,140,0.7)';trOuter='rgba(0,0,0,0)';
    }else if(trPhase===3){
      var ease=1-Math.pow(1-trProgress,3);
      trSizeMul=0.18+ease*1.32;trBreathMul=5-ease*4;trAlphaMul=0.4+ease*0.8;
      trInner='rgba(250,235,170,'+(0.7+ease*0.25).toFixed(2)+')';
      trOuter='rgba(240,210,130,'+(0+ease*0.35).toFixed(2)+')';
    }
    var tx=W*targetX,ty=H*targetY;
    cx=lerp(cx,tx,0.04);cy=lerp(cy,ty,0.04);
    gesture=lerp(gesture,targetGesture,0.08);
    var breath=1+0.05*Math.sin(t*0.001*(4/(DEF.breathS*trBreathMul))*Math.PI*2);
    var sz=80*DEF.size*trSizeMul*breath;
    var alpha=(0.75+0.25*Math.sin(t*0.001*(4/DEF.breathS)*Math.PI*2))*trAlphaMul;
    ctx.clearRect(0,0,W,H);

    if(trPhase!==2){trail.push({x:cx,y:cy});}
    while(trail.length>(trPhase===2?0:DEF.trailLen))trail.shift();
    for(var i=0;i<trail.length;i++){
      var tr=trail[i],frac=i/trail.length,trSz=sz*0.25*frac;
      ctx.beginPath();ctx.arc(tr.x,tr.y,Math.max(0.5,trSz),0,6.28);
      var tc=trPhase?trOuter:DEF.outerColor;
      var m=tc.match(/[\d.]+/g);
      ctx.fillStyle=m&&m.length>=4?'rgba('+m[0]+','+m[1]+','+m[2]+','+(parseFloat(m[3])*(0.4*frac)).toFixed(2)+')':tc;
      ctx.fill();
    }

    if(gesture>0.01&&trPhase!==2){
      var beamLen=140*gesture,dx=1;
      var grad=ctx.createLinearGradient(cx,cy,cx+dx*beamLen,cy);
      grad.addColorStop(0,'rgba(248,240,210,'+(0.35*gesture).toFixed(2)+')');
      grad.addColorStop(0.5,'rgba(248,240,210,'+(0.08*gesture).toFixed(2)+')');
      grad.addColorStop(1,'rgba(248,240,210,0)');
      ctx.beginPath();ctx.moveTo(cx,cy-sz*0.35);ctx.lineTo(cx+dx*beamLen,cy-sz*0.12);
      ctx.lineTo(cx+dx*beamLen,cy+sz*0.12);ctx.lineTo(cx,cy+sz*0.35);ctx.closePath();
      ctx.fillStyle=grad;ctx.fill();
    }

    var ic=trPhase?trInner:DEF.innerColor,oc=trPhase?trOuter:DEF.outerColor;
    var m2=ic.match(/[\d.]+/g);
    var innerA=m2&&m2.length>=4?Math.min(1,(parseFloat(m2[3])*alpha)).toFixed(2):'0.9';
    var g1=ctx.createRadialGradient(cx,cy,sz*0.02,cx,cy,sz*1.5);
    g1.addColorStop(0,'rgba('+m2[0]+','+m2[1]+','+m2[2]+','+innerA+')');
    g1.addColorStop(0.45,oc);g1.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(cx,cy,sz*1.5,0,6.28);ctx.fillStyle=g1;ctx.fill();
    var g2=ctx.createRadialGradient(cx,cy,0,cx,cy,sz*0.45);
    g2.addColorStop(0,ic);g2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(cx,cy,sz*0.45,0,6.28);ctx.fillStyle=g2;ctx.fill();
    var coreAlpha=trPhase===3?(0.9+trProgress*0.1)*alpha:0.9*alpha;
    ctx.beginPath();ctx.arc(cx,cy,sz*0.05,0,6.28);
    ctx.fillStyle='rgba(255,254,240,'+(Math.min(1,coreAlpha)).toFixed(2)+')';ctx.fill();

    requestAnimationFrame(A);
  }
  requestAnimationFrame(A);
  window.__peachSetGesture=function(v){targetGesture=v?1:0;};
})();

// ══════════════════════════════════════════════════════════════
// FPS counter
// ══════════════════════════════════════════════════════════════
(function(){
  var frames=0,last=performance.now(),el=document.getElementById('fps');
  function tick(t){
    frames++;
    if(t-last>=1000){el.textContent='FPS: '+Math.round(frames/((t-last)/1000));frames=0;last=t;}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

// Keyboard shortcuts
document.addEventListener('keydown',function(e){
  var keys={1:'serene',2:'enchanted',3:'tense',4:'released',5:'tranquil',6:'wistful'};
  if(keys[e.key])setMood(keys[e.key]);
  if(e.key==='g')window.__peachSetGesture(window.__peachSetGesture.last=!window.__peachSetGesture.last);
});
</script>
